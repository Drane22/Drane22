name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate neon-green contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Drane22
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A3E635&color_dots=#0D1117,#203723,#436F32,#79BD45,#B7EF73
            dist/github-snake-light.svg?palette=github-light&color_snake=#6B9F26&color_dots=#F1F7EA,#D2E9BB,#A8D782,#79B743,#447D25

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
